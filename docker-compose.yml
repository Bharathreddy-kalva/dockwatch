services:
  postgres:
    image: postgres:16
    container_name: dockwatch-postgres
    environment:
      POSTGRES_USER: dockwatch
      POSTGRES_PASSWORD: dockwatch
      POSTGRES_DB: dockwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dockwatch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka-API-compatible broker, single container, no Zookeeper.
  # Swap for real Kafka/MSK only if a task specifically requires it.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: dockwatch-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  minio:
    image: minio/minio
    container_name: dockwatch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dockwatch
      MINIO_ROOT_PASSWORD: dockwatch123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: dockwatch-prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: dockwatch-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: dockwatch
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  minio-data:
