name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dockwatch
          POSTGRES_PASSWORD: dockwatch
          POSTGRES_DB: dockwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dockwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ".[dev,dbt]"
      - name: Lint
        run: |
          ruff check src tests
          mypy src
      - name: Test
        run: pytest -v
        env:
          DATABASE_URL: postgresql+psycopg://dockwatch:dockwatch@localhost:5432/dockwatch
      - name: Migrate
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://dockwatch:dockwatch@localhost:5432/dockwatch
      # dbt/profiles.yml's env_var() defaults (localhost/5432/dockwatch/dockwatch)
      # already match the postgres service above, so no extra env vars needed here.
      - name: dbt run
        working-directory: dbt
        run: dbt run --profiles-dir .
      - name: dbt test
        working-directory: dbt
        run: dbt test --profiles-dir .
