global:
  scrape_interval: 5s

scrape_configs:
  - job_name: dockwatch-api
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Poller/consumer run on the host per the Makefile, not in Compose, so
  # they're scraped the same way as the api target above.
  - job_name: dockwatch-consumer
    static_configs:
      - targets: ["host.docker.internal:9101"]
